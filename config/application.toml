#:schema ../__pyronaut__/schemas/micronaut-application.schema.json
# Generated by pyronaut-install for Pyronaut TOML schema support.

[micronaut.application]
name = 'weather-agent'

[micronaut.server]
# Local only by default; deployments set WEATHER_BIND_HOST to the VPN/LAN address (or keep loopback behind a proxy).
host = '${WEATHER_BIND_HOST:127.0.0.1}'
# Tool arguments are small; GPX is capped at 5 MB of text in weather_core anyway.
max-request-size = 6291456  # 6 MiB

[weather]
# Host names (and Origin hosts) /mcp accepts; protects against DNS rebinding from browsers (McpHostFilter).
allowed-hosts = '${WEATHER_ALLOWED_HOSTS:`localhost,127.0.0.1,::1`}'

# Upstream downloads (ECMWF, DWD). The JDK's CA list lacks some roots the system (Mozilla) bundle has, e.g.
# HARICA, which signs data.ecmwf.int, so the client trusts the system PEM bundle.
[micronaut.certificate.file.system-ca]
path = '${WEATHER_CA_BUNDLE:`/etc/ssl/certs/ca-certificates.crt`}'
format = 'PEM'

[micronaut.http.client]
read-timeout = '5m'
max-content-length = 104857600  # 100 MiB: whole DWD GRIB files; ECMWF range responses are ~1 MB
follow-redirects = true

[micronaut.http.client.ssl]
trust-name = 'system-ca'

[micronaut.http.client.pool]
max-concurrent-http1-connections = 8

[micronaut.mcp.server]
transport = 'HTTP'

[micronaut.mcp.server.info]
name = 'weather-agent'
version = '0.1.0'


# Native access for numpy is enabled by src-java/at/yawk/weatheragent/NativeAccessCustomizer.java.
[graalpy.context]
# Java packages Python code may import, beyond the JDK/Jakarta/Micronaut defaults. GRIB decoding (ucar.*) happens
# inside at.yawk.weatheragent.GribDecoder, so Python needs only our own package.
host-class-lookup = ['at.yawk.weatheragent.']
