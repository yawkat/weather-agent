#:schema ../__pyronaut__/schemas/micronaut-application.schema.json
# Generated by pyronaut-install for Pyronaut TOML schema support.

[micronaut.application]
name = 'weather-agent'

[micronaut.server]
# Local only by default; deployments set MICRONAUT_SERVER_HOST to the VPN/LAN address (or keep loopback behind a
# proxy).
host = '127.0.0.1'
# Tool arguments are small; GPX is capped at 5 MB of text in weather_core anyway.
max-request-size = 6291456  # 6 MiB

# Settings under `weather` are documented in weather_agent/config.py and McpAccessConfig.java. Deployments set
# them through the environment, e.g. WEATHER_ALLOWED_HOSTS, WEATHER_ACCESS_KEY_FILE.

# Upstream downloads (ECMWF, DWD). The JDK's CA list lacks some roots the system (Mozilla) bundle has, e.g.
# HARICA, which signs data.ecmwf.int, so the client trusts the system PEM bundle (the package points
# MICRONAUT_CERTIFICATE_FILE_SYSTEM_PATH at its own).
[micronaut.certificate.file.system]
path = '/etc/ssl/certs/ca-certificates.crt'
format = 'PEM'

[weather.ecmwf]
# Open data comes from Google Cloud's copy (`base-url`, set in config.py) and, while that fails, from these hosts with
# the same layout and bytes, in order (weather_core.sources.mirrors). ECMWF's own server throttles (HTTP 429) while
# everyone fetches a new run; AWS's S3 bucket often answers 503 SlowDown then.
mirrors = [
    'https://data.ecmwf.int/forecasts',
    'https://ecmwf-forecasts.s3.eu-central-1.amazonaws.com',
]

[weather.prefetch]
# Every `interval`, fetch every step of each model's newest run for `variables` that isn't cached yet, so queries
# don't wait for downloads (weather_core.prefetch). About 220 GB of downloads a day and 90 GB of cache with these
# models; prefetch doesn't count against the download limits. RUC-EPS isn't kept warm: a new run every hour, for
# questions about the next few hours. For local runs, set WEATHER_PREFETCH_ENABLED=false.
interval = '10m'
models = ['ecmwf-ens', 'ecmwf-aifs-ens', 'icon-d2-eps', 'icon-eu-eps']
variables = ['precip', 't2m', 'td2m', 'wind', 'gust', 'cloud']

# One client per upstream (http_fetcher.Fetchers). Request URLs are absolute, so `url` is only a default.
[micronaut.http.services.ecmwf]
url = 'https://data.ecmwf.int'
read-timeout = '5m'
max-content-length = 104857600  # 100 MiB; range responses are ~1 MB
follow-redirects = true
ssl.trust-name = 'system'
# The Google Cloud mirror negotiates HTTP/2, which is slow with Micronaut's client (see the dwd service below).
alpn-modes = ['http/1.1']
pool.max-concurrent-http1-connections = 8

[micronaut.http.services.dwd]
url = 'https://opendata.dwd.de'
read-timeout = '5m'
max-content-length = 104857600  # 100 MiB; per-member GRIB files are ~1 MB
follow-redirects = true
ssl.trust-name = 'system'
# opendata.dwd.de negotiates HTTP/2, and Micronaut's HTTP/2 client advertises no flow-control window: the server
# may send only 64 KiB per round trip on the one shared connection, ~1.5 MB/s in total. HTTP/1.1 over 8
# connections gets ~50 MB/s. https://github.com/micronaut-projects/micronaut-core/issues/13798
alpn-modes = ['http/1.1']
pool.max-concurrent-http1-connections = 8

[micronaut.http.services.nominatim]
url = 'https://nominatim.openstreetmap.org'
read-timeout = '30s'  # GeocodeService also bounds each wait (weather.geocoder.timeout-seconds)
max-content-length = 1048576  # 1 MiB; search results are a few kB
follow-redirects = true
ssl.trust-name = 'system'
# Requests are one at a time, but a timed-out attempt may still hold its connection while the retry runs.
pool.max-concurrent-http1-connections = 2

[micronaut.mcp.server]
transport = 'HTTP'
# /mcp, or /mcp/<access key>. The key segment is a template variable so routing doesn't compare it; McpKeyFilter does.
endpoint = '/mcp{/key}'

[micronaut.mcp.server.info]
name = 'weather-agent'
version = '0.1.0'


# Native access for numpy is enabled by src-java/at/yawk/weatheragent/NativeAccessCustomizer.java.
[graalpy.context]
# Java packages Python code may import, beyond the JDK/Jakarta/Micronaut defaults. GRIB decoding (ucar.*) happens
# inside at.yawk.weatheragent.GribDecoder, so Python needs only our own package.
host-class-lookup = ['at.yawk.weatheragent.']
