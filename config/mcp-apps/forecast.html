<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forecast chart</title>
<!--
  MCP Apps view for the show_forecast tool. The host renders it in a sandboxed frame and talks JSON-RPC over
  postMessage: ui/initialize, then the tool's arguments (tool-input) and result (tool-result). Self-contained:
  the default MCP Apps CSP allows no external scripts, styles, images or fetches.

  The result (weather_core.chart) is a list of fields, each a dense array with named dimensions. The dimensions
  pick the drawing: time / hour / distance bins, or lat or lon alone (a profile) → graph; lat × lon → map
  (time → slider); point without an x axis → markers on a map; anything else → dots and ranges per model. model → colour, member → thin lines,
  quantile → bands. The view never reduces data itself: what it shows is what the query asked for.
-->
<style>
:root {
  color-scheme: light;
  --surface: var(--color-background-primary, #fcfcfb);
  --ink: var(--color-text-primary, #0b0b0b);
  --ink-2: var(--color-text-secondary, #52514e);
  --muted: #898781;
  --grid: #e1e0d9;
  --axis: #c3c2b7;
  --land: #52514e;
  --water: #dce7f1; --ground: #f3f2ee; --river: #3b7cc4; --road: #6b5a48;
  --ring: rgba(11, 11, 11, 0.10);
  --wash: rgba(11, 11, 11, 0.05);
  --night: rgba(42, 50, 90, 0.07);
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100;
  --s5: #e87ba4; --s6: #008300; --s7: #4a3aa7; --s8: #e34948;
  --font: var(--font-sans, system-ui, -apple-system, "Segoe UI", sans-serif);
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --surface: var(--color-background-primary, #1a1a19);
    --ink: var(--color-text-primary, #ffffff);
    --ink-2: var(--color-text-secondary, #c3c2b7);
    --grid: #2c2c2a; --axis: #383835; --land: #c3c2b7;
    --water: #1d2731; --ground: #222221; --river: #6aa3e3; --road: #cdbca8;
    --ring: rgba(255, 255, 255, 0.10); --wash: rgba(255, 255, 255, 0.06); --night: rgba(0, 0, 0, 0.28);
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
    --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --surface: var(--color-background-primary, #1a1a19);
  --ink: var(--color-text-primary, #ffffff);
  --ink-2: var(--color-text-secondary, #c3c2b7);
  --grid: #2c2c2a; --axis: #383835; --land: #c3c2b7;
    --water: #1d2731; --ground: #222221; --river: #6aa3e3; --road: #cdbca8;
  --ring: rgba(255, 255, 255, 0.10); --wash: rgba(255, 255, 255, 0.06); --night: rgba(0, 0, 0, 0.28);
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
  --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--surface); color: var(--ink); font: 14px/1.4 var(--font); }
#app { position: relative; padding: 12px 16px 16px; }
header { display: flex; align-items: flex-start; gap: 8px; }
header .titles { flex: 1; min-width: 0; }
h1 { font-size: 16px; font-weight: 600; margin: 0; overflow-wrap: anywhere; }
h2 { font-size: 13px; font-weight: 600; margin: 14px 0 2px; }
.sub { color: var(--ink-2); font-size: 12px; margin: 2px 0 0; }
button { font: inherit; color: inherit; }
#fullscreen { border: 1px solid var(--ring); background: transparent; border-radius: 6px; padding: 4px 8px;
  font-size: 12px; cursor: pointer; }
#fullscreen:hover { background: var(--wash); }
.chips { display: flex; gap: 6px; overflow-x: auto; margin: 10px -16px 2px; padding: 0 16px 4px;
  scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--ring);
  background: transparent; border-radius: 999px; padding: 4px 10px; font-size: 12px; cursor: pointer;
  white-space: nowrap; }
.chip:hover { background: var(--wash); }
.chip[aria-pressed="true"] { border-color: var(--ink); font-weight: 600; }
.key { display: inline-block; width: 14px; height: 2px; border-radius: 1px; background: currentColor; flex: none; }
.key.band { height: 8px; opacity: 0.25; border-radius: 2px; }
.key.thin { height: 1px; opacity: 0.5; }
.key.dot { width: 8px; height: 8px; border-radius: 50%; }
.key.bar { width: 8px; height: 10px; border-radius: 1px; opacity: 0.9; }
.key.bar.faint { opacity: 0.3; }
.key.night { width: 12px; height: 10px; border-radius: 2px; background: var(--night); box-shadow: inset 0 0 0 1px var(--ring); }
svg text.now { fill: var(--ink-2); font-size: 10px; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; color: var(--ink-2); font-size: 12px; margin: 6px 0 2px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.panel { margin-top: 10px; }
.panel-head { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--ink-2); }
.panel-head b { color: var(--ink); font-weight: 600; }
.panel svg { display: block; width: 100%; touch-action: pan-y; outline: none; }
.panel svg:focus-visible { box-shadow: 0 0 0 2px var(--ring); border-radius: 4px; }
svg text { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
svg text.place { fill: var(--ink); font-size: 11px; paint-order: stroke; stroke: var(--surface); stroke-width: 3px; }
svg text.town { fill: var(--ink-2); font-size: 10px; paint-order: stroke; stroke: var(--surface); stroke-width: 2.5px;
  stroke-opacity: 0.85; }
svg text.town.big { fill: var(--ink); font-size: 11px; font-weight: 600; }
.maps { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); gap: 10px 14px; }
.scale { margin-top: 6px; }
.scale svg { display: block; max-width: 100%; }
.slider { display: flex; align-items: center; gap: 10px; margin: 10px 0 0; font-size: 12px; }
.slider input { flex: 1; min-width: 0; }
.slider output { min-width: 9em; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.slider button { border: 1px solid var(--ring); background: transparent; border-radius: 6px; padding: 2px 8px;
  cursor: pointer; }
.stat { font-size: 28px; font-weight: 600; margin: 8px 0 0; font-variant-numeric: tabular-nums; }
#tooltip { position: absolute; z-index: 2; pointer-events: none; display: none; min-width: 140px; max-width: 320px;
  background: var(--surface); border: 1px solid var(--ring); border-radius: 8px; padding: 6px 8px;
  box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12); font-size: 12px; }
#tooltip .when { color: var(--ink-2); margin-bottom: 4px; }
#tooltip .row { display: flex; align-items: baseline; gap: 6px; }
#tooltip .row .key { align-self: center; }
#tooltip .row strong { font-variant-numeric: tabular-nums; white-space: nowrap; }
#tooltip .row .range { color: var(--ink-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
#tooltip .row .what { color: var(--ink-2); margin-left: auto; padding-left: 8px; white-space: nowrap; }
#notes { margin-top: 12px; font-size: 12px; color: var(--ink-2); }
#notes p { margin: 2px 0; }
#warnings p { margin: 8px 0 0; font-size: 12px; color: var(--ink); }
#warnings p::before { content: "⚠ "; }
details { margin-top: 10px; font-size: 12px; }
summary { cursor: pointer; color: var(--ink-2); }
pre { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 11px; color: var(--ink-2); margin: 6px 0 0; }
.table-scroll { overflow-x: auto; max-height: 320px; margin-top: 6px; }
table { border-collapse: collapse; font-variant-numeric: tabular-nums; white-space: nowrap; }
th, td { padding: 2px 10px 2px 0; text-align: right; border-bottom: 1px solid var(--grid); }
th:first-child, td:first-child { text-align: left; }
th { position: sticky; top: 0; background: var(--surface); font-weight: 600; }
footer { margin-top: 12px; font-size: 11px; color: var(--muted); }
footer p { margin: 2px 0; }
#status { color: var(--ink-2); padding: 24px 0; white-space: pre-wrap; }
#status.error { color: var(--ink); }
[hidden] { display: none !important; }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="titles">
      <h1 id="title">Forecast</h1>
      <p class="sub" id="subtitle"></p>
    </div>
    <button id="fullscreen" type="button" hidden>Expand</button>
  </header>
  <div id="status">Waiting for the forecast…</div>
  <div id="content" hidden>
    <div id="warnings"></div>
    <nav class="chips" id="models" aria-label="Model"></nav>
    <div id="body"></div>
    <details id="table-wrap"><summary>Table</summary><div class="table-scroll" id="table"></div></details>
    <details><summary>Query</summary><pre id="query"></pre></details>
    <div id="notes"></div>
    <footer id="attribution"></footer>
  </div>
  <div id="tooltip" role="status" aria-live="polite"></div>
</div>
<script>
"use strict";

// ---- protocol ---------------------------------------------------------------------------------------------

const PROTOCOL_VERSION = "2026-01-26";
const APP_INFO = { name: "weather-agent-forecast-chart", version: "0.1.0" };
let nextId = 1;
const pending = new Map();
let hostContext = {};

function post(message) {
  window.parent.postMessage({ jsonrpc: "2.0", ...message }, "*");
}

function request(method, params) {
  const id = nextId++;
  post({ id, method, params });
  return new Promise((resolve, reject) => pending.set(id, { resolve, reject }));
}

function notify(method, params) {
  post({ method, params });
}

window.addEventListener("message", (event) => {
  if (event.source !== window.parent) return;
  const m = event.data;
  if (!m || m.jsonrpc !== "2.0") return;
  if (m.method === undefined && m.id !== undefined) {
    const p = pending.get(m.id);
    if (!p) return;
    pending.delete(m.id);
    if (m.error) p.reject(m.error); else p.resolve(m.result);
    return;
  }
  const params = m.params || {};
  switch (m.method) {
    case "ui/notifications/tool-input":
    case "ui/notifications/tool-input-partial":
      showLoading(params.arguments || {});
      break;
    case "ui/notifications/tool-result":
      showResult(params);
      break;
    case "ui/notifications/tool-cancelled":
      showStatus("The forecast request was cancelled.", false);
      break;
    case "ui/notifications/host-context-changed":
      applyContext({ ...hostContext, ...params });
      break;
    case "ui/resource-teardown":
    case "ping":
      if (m.id !== undefined) post({ id: m.id, result: {} });
      break;
    default:
      if (m.id !== undefined) post({ id: m.id, error: { code: -32601, message: "Method not found" } });
  }
});

function applyContext(context) {
  hostContext = context || {};
  const root = document.documentElement;
  if (hostContext.theme === "light" || hostContext.theme === "dark") root.dataset.theme = hostContext.theme;
  const variables = (hostContext.styles && hostContext.styles.variables) || {};
  for (const [name, value] of Object.entries(variables)) {
    if (name.startsWith("--") && typeof value === "string") root.style.setProperty(name, value);
  }
  const fonts = hostContext.styles && hostContext.styles.css && hostContext.styles.css.fonts;
  if (typeof fonts === "string" && !document.getElementById("host-fonts")) {
    const style = document.createElement("style");
    style.id = "host-fonts";
    style.textContent = fonts;
    document.head.appendChild(style);
  }
  const insets = hostContext.safeAreaInsets;
  if (insets) {
    const app = document.getElementById("app");
    app.style.paddingLeft = `${16 + (insets.left || 0)}px`;
    app.style.paddingRight = `${16 + (insets.right || 0)}px`;
    app.style.paddingBottom = `${16 + (insets.bottom || 0)}px`;
  }
  const modes = hostContext.availableDisplayModes || [];
  const button = document.getElementById("fullscreen");
  button.hidden = !modes.includes("fullscreen");
  button.textContent = hostContext.displayMode === "fullscreen" ? "Close" : "Expand";
  if (chart) render();
}

document.getElementById("fullscreen").addEventListener("click", () => {
  const mode = hostContext.displayMode === "fullscreen" ? "inline" : "fullscreen";
  request("ui/request-display-mode", { mode }).then((result) => {
    applyContext({ ...hostContext, displayMode: (result && result.mode) || mode });
  }).catch(() => {});
});

new ResizeObserver(() => {
  const el = document.documentElement;
  notify("ui/notifications/size-changed", { width: el.scrollWidth, height: el.scrollHeight });
}).observe(document.body);

request("ui/initialize", {
  protocolVersion: PROTOCOL_VERSION,
  appInfo: APP_INFO,
  clientInfo: APP_INFO,
  capabilities: {},
  appCapabilities: { availableDisplayModes: ["inline", "fullscreen"] },
}).then((result) => {
  applyContext((result && result.hostContext) || {});
  notify("ui/notifications/initialized", {});
}).catch(() => {});

// ---- data -------------------------------------------------------------------------------------------------

// Colour follows the model, never its position in this result: fixed slots in this order, then the rest.
const MODEL_ORDER = ["ecmwf-ens", "ecmwf-aifs-ens", "icon-eu-eps", "icon-d2-eps", "icon-d2-ruc-eps"];
const X_DIMS = ["time", "hour", "distance_km_bins", "lat", "lon"]; // lat or lon alone: a profile
const SVG = "http://www.w3.org/2000/svg";
const NO_ZERO_UNITS = ["°C", "°F", "K", "°", "hPa"];

let chart = null;
let fields = [];
let modelIds = [];
let selectedModel = null; // null: all models
let playing = null; // the time slider's timer; maps keep their own time and quantile in field.view

function showStatus(text, error) {
  const status = document.getElementById("status");
  status.textContent = text;
  status.classList.toggle("error", !!error);
  status.hidden = false;
  document.getElementById("content").hidden = true;
}

function showLoading(args) {
  if (chart) return;
  if (args.title) document.getElementById("title").textContent = args.title;
  showStatus("Loading the ensemble forecast… the first request for a place or area can take a few minutes.");
}

function showResult(result) {
  const c = result.structuredContent;
  if (result.isError || !c || !Array.isArray(c.fields)) {
    const text = (result.content || []).map((x) => x.text || "").join("\n").trim();
    showStatus(text || "The forecast could not be loaded.", true);
    return;
  }
  chart = c;
  fields = c.fields.map(prepareField);
  const present = new Set(fields.flatMap((f) => (f.coords.model ? f.coords.model.labels : [])));
  const known = MODEL_ORDER.filter((id) => present.has(id));
  modelIds = [...known, ...[...present].filter((id) => !MODEL_ORDER.includes(id)).sort()];
  if (selectedModel !== null && !present.has(selectedModel)) selectedModel = null;
  stopPlaying();
  document.getElementById("status").hidden = true;
  document.getElementById("content").hidden = false;
  render();
}

function slotOf(model) {
  if (model === undefined) return 0;
  const i = MODEL_ORDER.includes(model) ? MODEL_ORDER.indexOf(model)
    : MODEL_ORDER.length + modelIds.filter((id) => !MODEL_ORDER.includes(id)).indexOf(model);
  return Math.min(i, 7);
}

function colorOf(model) {
  return `var(--s${slotOf(model) + 1})`;
}

// Past three, colours alone don't keep every pair of models apart (yellow next to orange, magenta next to aqua
// for red-green colour blindness): the median lines of the later slots are dashed too. [stroke-dasharray for
// width 2 with round caps, the same as a CSS gradient for keys]
const DASHES = [
  ["5 5", "currentColor 0 4px, transparent 4px 7px"],
  ["0.5 4", "currentColor 0 2px, transparent 2px 5px"],
  ["9 4 0.5 4", "currentColor 0 6px, transparent 6px 8px, currentColor 8px 10px, transparent 10px 12px"],
];

function dashOf(model) {
  const i = slotOf(model);
  return i < 3 ? null : DASHES[(i - 3) % DASHES.length];
}

// A legend key in the model's colour and dash.
function modelKey(parent, model) {
  const key = html("span", { class: "key" }, parent);
  key.style.color = colorOf(model);
  const dash = dashOf(model);
  if (dash) key.style.background = `repeating-linear-gradient(to right, ${dash[1]})`;
  return key;
}

function modelName(id) {
  const m = (chart.models || []).find((x) => x.model === id);
  return m ? m.name : id;
}

// A field: dims, coords, flat row-major data; at(index by dim name) reads one value.
function prepareField(f) {
  const sizes = f.dims.map((d) => coordSize(d, f.coords[d]));
  const strides = sizes.map((_, i) => sizes.slice(i + 1).reduce((a, b) => a * b, 1));
  const values = f.data.filter((v) => v !== null);
  // Conditions left unreduced are yes/no; unitless numbers within 0…1 (a condition's mean) are probabilities.
  const yesno = f.kind === "condition";
  const percent = !yesno && f.unit === "" && values.length > 0 && values.every((v) => v >= 0 && v <= 1);
  // Amounts can go negative only as differences (between models, over time), which aren't amounts to draw as such.
  const negative = values.some((v) => v < 0);
  return {
    ...f, sizes, strides, percent, yesno, negative,
    view: { timeIndex: 0, quantile: null },
    has: (d) => f.dims.includes(d),
    size: (d) => sizes[f.dims.indexOf(d)] || 1,
    at(index) {
      let k = 0;
      for (let i = 0; i < f.dims.length; i++) k += (index[f.dims[i]] || 0) * strides[i];
      return f.data[k];
    },
  };
}

// What a field measures, from its unit (and name): picks bars or lines and the map's colours. The unit follows
// the query's arithmetic, so precip.sum("time") is still precipitation (mm).
function quantityOf(f) {
  if (f.yesno) return "condition";
  if (f.percent) return "probability";
  switch (f.unit) {
    // A difference of precipitation (negative somewhere) is lines and a diverging map, not bars and dry cells.
    case "mm/h": case "mm": return f.negative ? null : "precip";
    case "°C": return "temperature";
    case "km/h": return "wind";
    case "W/m²": case "J/kg": return "energy";
    case "%": return /cloud/i.test(f.name || "") ? "cloud" : null;
    default: return null;
  }
}

// Precipitation counts as wet from 0.1 mm/h (or mm, summed).
const WET = 0.1;

function coordSize(dim, c) {
  if (dim === "time") return c.minutes.length;
  if (dim === "point") return c.lat.length;
  return (c.values || c.labels).length;
}

function modelIndex(f, model) {
  return f.coords.model ? f.coords.model.labels.indexOf(model) : -1;
}

// [min, max] of the non-null values, or null; a loop, as spreading 100k+ values into Math.min overflows the stack.
function extent(values) {
  let lo = Infinity;
  let hi = -Infinity;
  for (const v of values) {
    if (v === null || v === undefined) continue;
    if (v < lo) lo = v;
    if (v > hi) hi = v;
  }
  return lo <= hi ? [lo, hi] : null;
}

function quantile(sorted, p) {
  if (!sorted.length) return null;
  const pos = (sorted.length - 1) * p;
  const lo = Math.floor(pos);
  const hi = Math.ceil(pos);
  return sorted[lo] + (sorted[hi] - sorted[lo]) * (pos - lo);
}

// ---- formatting -------------------------------------------------------------------------------------------

const formatters = new Map();

function formatter(options) {
  const key = JSON.stringify(options);
  if (!formatters.has(key)) {
    let f;
    try {
      f = new Intl.DateTimeFormat(hostContext.locale || undefined, { ...options, timeZone: chart.timezone || "UTC" });
    } catch (e) {
      f = new Intl.DateTimeFormat(undefined, { ...options, timeZone: "UTC" });
    }
    formatters.set(key, f);
  }
  return formatters.get(key);
}

const date = (minutes) => new Date(minutes * 60000);
const fmtDay = (m) => formatter({ weekday: "short", day: "numeric" }).format(date(m));
const fmtDate = (m) => formatter({ weekday: "short", day: "numeric", month: "short" }).format(date(m));
const fmtWhen = (m) => formatter({ weekday: "short", day: "numeric", month: "short", hour: "2-digit",
  minute: "2-digit", hourCycle: "h23" }).format(date(m));

// The whole local hours from a to b, as [minutes, hour]. Steps of 15 minutes, as zones like Asia/Kolkata (+5:30)
// or Asia/Kathmandu (+5:45) start their hours off the UTC hour.
function localHours(a, b) {
  const f = formatter({ hour: "numeric", minute: "numeric", hourCycle: "h23" });
  const out = [];
  for (let t = Math.ceil(a / 15) * 15; t <= b; t += 15) {
    const parts = f.formatToParts(date(t));
    const part = (type) => Number((parts.find((p) => p.type === type) || {}).value);
    if (part("minute") === 0) out.push([t, part("hour")]);
  }
  return out;
}

function stepMinutes(step) {
  const match = /^(\d*)([hD])$/.exec(step || "");
  if (!match) return 0;
  return (Number(match[1] || 1)) * (match[2] === "D" ? 1440 : 60);
}

function fmtValue(f, v) {
  if (v === null || v === undefined) return "–";
  if (f.yesno) return v >= 0.5 ? "yes" : "no";
  if (f.percent) return `${Math.round(v * 100)} %`;
  const a = Math.abs(v);
  const digits = a >= 100 || a === 0 ? 0 : a >= 10 ? 1 : a >= 1 ? 1 : 2;
  return `${v.toFixed(digits)}${f.unit ? ` ${f.unit}` : ""}`;
}

function fmtTick(f, v) {
  if (f.yesno) return v === 1 ? "yes" : v === 0 ? "no" : "";
  if (f.percent) return `${Math.round(v * 100)}%`;
  return String(+v.toFixed(6));
}

function fieldLabel(f) {
  return f.name || (chart.fields.length === 1 ? (chart.title ? "" : "Value") : "value");
}

function quantileLabel(q) {
  return `${+(q * 100).toFixed(1)} %`;
}

// ---- layout -----------------------------------------------------------------------------------------------

function el(tag, attrs, parent) {
  const node = document.createElementNS(SVG, tag);
  for (const [k, v] of Object.entries(attrs || {})) node.setAttribute(k, v);
  if (parent) parent.appendChild(node);
  return node;
}

function html(tag, attrs, parent, text) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) node.setAttribute(k, v);
  if (text !== undefined) node.textContent = text;
  if (parent) parent.appendChild(node);
  return node;
}

function chip(parent, label, pressed, onClick, model) {
  const button = html("button", { type: "button", class: "chip", "aria-pressed": String(pressed) }, parent);
  if (model !== undefined) modelKey(button, model);
  button.appendChild(document.createTextNode(label));
  button.addEventListener("click", onClick);
  return button;
}

function legendItem(parent, color, cls, text) {
  const item = html("span", {}, parent);
  const key = html("span", { class: `key ${cls}` }, item);
  key.style.color = color;
  item.appendChild(document.createTextNode(text));
}

function kindOf(f) {
  if (f.has("lat") && f.has("lon")) return "grid";
  const x = X_DIMS.find((d) => f.has(d));
  if (x) return "graph";
  if (f.has("point") && !f.has("member")) return "points";
  return "dots";
}

function render() {
  formatters.clear();
  hideTooltip();
  stopPlaying(); // its slider is rebuilt below
  const title = chart.title || (fields.length === 1 && fields[0].name) || "Forecast";
  document.getElementById("title").textContent = title;
  document.getElementById("subtitle").textContent = subtitle();
  renderWarnings();
  renderModelChips();
  const body = document.getElementById("body");
  body.replaceChildren();
  const graphs = fields.filter((f) => kindOf(f) === "graph");
  if (graphs.length) renderGraphs(body, graphs);
  for (const f of fields.filter((x) => kindOf(x) === "grid" || kindOf(x) === "points")) renderMaps(body, f);
  for (const f of fields.filter((x) => kindOf(x) === "dots")) renderDots(body, f);
  renderTable();
  document.getElementById("query").textContent = chart.query || "";
  renderNotes();
  renderAttribution();
}

function subtitle() {
  const times = fields.flatMap((f) => (f.coords.time ? f.coords.time.minutes : []));
  if (!times.length) return chart.timezone || "";
  const [a, b] = extent(times);
  const range = a === b ? fmtWhen(a) : `${fmtWhen(a)} – ${fmtWhen(b)}`;
  if (!chart.timezone) return range;
  // The zone's name and its offset, both when daylight saving time changes within the range.
  const offsets = [...new Set([a, b].map(offsetOf))].filter((o) => o && o !== chart.timezone);
  return `${range} (${[chart.timezone, offsets.join("/")].filter(Boolean).join(", ")})`;
}

// "UTC+5:30", "UTC" for UTC+0 (so London across the end of summer time is "UTC+1/UTC"); "" where the browser
// doesn't know shortOffset (Safari before 15.4).
function offsetOf(m) {
  let parts;
  try {
    parts = formatter({ timeZoneName: "shortOffset" }).formatToParts(date(m));
  } catch (e) {
    return "";
  }
  const name = (parts.find((p) => p.type === "timeZoneName") || {}).value;
  // Chrome writes UTC+0 as "GMT", others as "GMT+0".
  if (!name) return "";
  return /^GMT(\+0)?$/.test(name) ? "UTC" : name.replace("GMT", "UTC");
}

function renderWarnings() {
  const box = document.getElementById("warnings");
  box.replaceChildren();
  for (const w of chart.warnings || []) html("p", {}, box, w);
  for (const name of chart.omitted || []) {
    html("p", {}, box, `${name || "The answer"} is a time or place label (idxmax/idxmin); it is in the agent's ` +
      "answer, not drawn here.");
  }
}

function renderModelChips() {
  const nav = document.getElementById("models");
  nav.replaceChildren();
  nav.hidden = modelIds.length < 2;
  if (nav.hidden) return;
  chip(nav, "All models", selectedModel === null, () => { selectedModel = null; render(); });
  for (const id of modelIds) {
    chip(nav, modelName(id), selectedModel === id, () => { selectedModel = id; render(); }, id);
  }
}

function shownModels(f) {
  if (!f.has("model")) return [undefined];
  const labels = f.coords.model.labels;
  const order = modelIds.filter((id) => labels.includes(id));
  return selectedModel === null ? order : order.filter((id) => id === selectedModel);
}

// ---- graphs -----------------------------------------------------------------------------------------------

const MARGIN = { l: 44, r: 8, t: 6, b: 20 };
const TOP_AXIS = 16;
let graphPanels = []; // { svg, x(t), field, place, frame }
let hoverX = null;

function xAxisOf(f) {
  const d = X_DIMS.find((x) => f.has(x));
  const c = f.coords[d];
  // Precipitation over buckets (hours, resampled steps, hours of the day, bins) is a bar per bucket: each sample
  // stands for the interval starting at its label.
  const bars = quantityOf(f) === "precip";
  if (d === "time") {
    const step = stepMinutes(c.step);
    return { dim: d, positions: c.minutes, width: step, time: true, route: c.lat ? c : null, bars: bars && step > 0 };
  }
  if (d === "hour") return { dim: d, positions: c.values, width: 1, labels: c.values.map((h) => `${h}:00`), bars };
  if (d === "lat" || d === "lon") {
    return { dim: d, positions: c.values, width: 0, labels: c.values.map((v) => `${+v.toFixed(2)}°${d === "lat" ? "N" : "E"}`) };
  }
  return { dim: d, positions: c.labels.map((_, i) => i), width: 1, labels: c.labels, bars };
}

function renderGraphs(body, graphs) {
  graphPanels = [];
  const axes = graphs.map(xAxisOf);
  const timeAxes = axes.filter((a) => a.time);
  const route = timeAxes.find((a) => a.route);
  if (route) renderRouteMap(body, route.route);
  // Graphs share one x range per kind of axis.
  const ranges = {};
  for (const a of axes) {
    const r = ranges[a.dim] || [Infinity, -Infinity];
    const [first, last] = extent(a.positions);
    ranges[a.dim] = [Math.min(r[0], first), Math.max(r[1], last + spanOf(a))];
  }
  const legend = html("div", { class: "legend" }, body);
  const lines = graphs.filter((f, i) => !axes[i].bars);
  const bars = graphs.filter((f, i) => axes[i].bars);
  const anyMembers = lines.some((f) => f.has("member"));
  const anyQuantile = lines.some((f) => f.has("quantile"));
  if (anyMembers) legendItem(legend, "var(--ink-2)", "thin", "one line per member");
  if (anyMembers || anyQuantile) legendItem(legend, "var(--ink-2)", "band", anyMembers ? "10–90 % of members" : "quantile range");
  if (anyMembers || anyQuantile) legendItem(legend, "var(--ink-2)", "", "median");
  if (bars.some((f) => f.has("member") || f.has("quantile"))) {
    legendItem(legend, "var(--ink-2)", "bar", "median");
    legendItem(legend, "var(--ink-2)", "bar faint", bars.some((f) => f.has("member")) ? "9 in 10 members up to"
      : "highest quantile");
  }
  if (graphs.some((f, i) => axes[i].time && sunPlace(f, 0, axes[i]))) legendItem(legend, "", "night", "night");
  if (!legend.childNodes.length) legend.remove();
  const width = Math.max(document.getElementById("body").clientWidth, 280);
  let first = true;
  graphs.forEach((f, i) => {
    const places = f.has("point") ? f.size("point") : 1;
    for (let p = 0; p < places; p++) {
      const panel = html("div", { class: "panel" }, body);
      const head = html("div", { class: "panel-head" }, panel);
      const label = html("span", {}, head);
      html("b", {}, label, fieldLabel(f));
      label.appendChild(document.createTextNode(`${f.unit && !f.percent ? ` ${f.unit}` : ""}`));
      if (f.has("point")) head.appendChild(document.createTextNode(placeName(f, p)));
      const top = first && axes[i].time ? MARGIN.t + TOP_AXIS : MARGIN.t;
      const height = 120 + top + MARGIN.b;
      const svg = el("svg", { viewBox: `0 0 ${width} ${height}`, height, tabindex: 0, role: "img",
        "aria-label": `${fieldLabel(f)} graph; use the arrow keys to read values` }, panel);
      const frame = { width, height, top, axis: axes[i], range: ranges[axes[i].dim], topAxis: first && axes[i].time };
      drawGraph(svg, f, p, frame);
      first = false;
    }
  });
}

function placeName(f, p) {
  const c = f.coords.point;
  return c.labels ? c.labels[p] : `${c.lat[p].toFixed(2)}, ${c.lon[p].toFixed(2)}`;
}

function niceTicks(lo, hi, count) {
  const span = hi - lo || 1;
  const raw = span / count;
  const mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 2.5, 5, 10].map((k) => k * mag).find((s) => span / s <= count) || 10 * mag;
  const ticks = [];
  for (let v = Math.ceil(lo / step) * step; v <= hi + step * 1e-9; v += step) ticks.push(+v.toFixed(10));
  return ticks;
}

// The series of a graph panel: per model, members and/or quantile levels, along the x axis.
function seriesOf(f, place, model) {
  const n = f.size(xAxisOf(f).dim);
  const xdim = xAxisOf(f).dim;
  const base = { point: place };
  if (model !== undefined) base.model = modelIndex(f, model);
  const read = (extra) => Array.from({ length: n }, (_, i) => f.at({ ...base, ...extra, [xdim]: i }));
  if (f.has("member")) {
    const members = Array.from({ length: f.size("member") }, (_, m) => read({ member: m }));
    const q = { p10: [], p50: [], p90: [] };
    for (let i = 0; i < n; i++) {
      const column = members.map((row) => row[i]).filter((v) => v !== null).sort((a, b) => a - b);
      q.p10.push(quantile(column, 0.1));
      q.p50.push(quantile(column, 0.5));
      q.p90.push(quantile(column, 0.9));
    }
    return { members, bands: [[q.p10, q.p90]], median: q.p50 };
  }
  if (f.has("quantile")) {
    const levels = f.coords.quantile.values;
    const order = levels.map((q, i) => [q, i]).sort((a, b) => a[0] - b[0]).map((x) => x[1]);
    const lines = order.map((i) => read({ quantile: i }));
    const bands = [];
    for (let i = 0; i < Math.floor(lines.length / 2); i++) bands.push([lines[i], lines[lines.length - 1 - i]]);
    const median = lines.length % 2 ? lines[(lines.length - 1) / 2] : null;
    return { members: [], bands, median };
  }
  return { members: [], bands: [], median: read({}) };
}

function drawGraph(svg, f, place, frame) {
  const { width, height, top, axis, range } = frame;
  const [x0, x1] = range;
  const x = (t) => MARGIN.l + ((t - x0) / (x1 - x0 || 1)) * (width - MARGIN.l - MARGIN.r);
  const models = shownModels(f);
  const series = models.map((m) => ({ model: m, color: colorOf(m), ...seriesOf(f, place, m) }));
  if (axis.bars) for (const s of series) Object.assign(s, barsOf(s));
  let lo = Infinity;
  let hi = -Infinity;
  for (const s of series) {
    const rows = axis.bars ? [s.solid, s.faint || []] : [...s.members, ...s.bands.flat(), s.median || []];
    for (const row of rows) {
      for (const v of row) {
        if (v === null) continue;
        lo = Math.min(lo, v);
        hi = Math.max(hi, v);
      }
    }
  }
  if (!isFinite(lo)) { lo = 0; hi = 1; }
  if (f.percent || f.yesno) { lo = 0; hi = Math.max(hi, 1); }
  if (axis.bars) lo = Math.min(lo, 0); // bars stand on 0
  // Amounts start the axis at 0 when they come close; temperatures and directions have no such zero.
  if (lo > 0 && lo < (hi - lo) * 0.5 && !NO_ZERO_UNITS.includes(f.unit)) lo = 0;
  if (hi - lo < 1e-9) hi = lo + 1;
  const ticks = niceTicks(lo, hi, 4);
  lo = Math.min(lo, ticks[0]);
  hi = Math.max(hi, ticks[ticks.length - 1]);
  const y = (v) => top + (1 - (v - lo) / (hi - lo)) * (height - top - MARGIN.b);

  const grid = el("g", {}, svg);
  for (const tick of ticks) {
    el("line", { x1: MARGIN.l, x2: width - MARGIN.r, y1: y(tick), y2: y(tick), stroke: "var(--grid)",
      "shape-rendering": "crispEdges" }, grid);
    el("text", { x: MARGIN.l - 6, y: y(tick) + 4, "text-anchor": "end" }, grid).textContent = fmtTick(f, tick);
  }
  if (axis.time) {
    const sun = sunPlace(f, place, axis);
    if (sun) {
      for (const [a, b] of nights(x0, x1, sun)) {
        el("rect", { x: x(a), y: top, width: Math.max(0, x(b) - x(a)), height: height - MARGIN.b - top,
          fill: "var(--night)" }, grid);
      }
    }
    const hours = localHours(x0, x1);
    const days = hours.filter(([, h]) => h === 0).map(([t]) => t);
    for (const t of days) {
      el("line", { x1: x(t), x2: x(t), y1: top, y2: height - MARGIN.b, stroke: "var(--axis)",
        "shape-rendering": "crispEdges" }, grid);
    }
    // 6, 12 and 18 o'clock as ticks under the axis, where they're far enough apart to mean something.
    if (days.length && x(x0 + 360) - x(x0) >= 8) {
      for (const [t, hour] of hours) {
        if (hour % 6 || hour === 0) continue;
        el("line", { x1: x(t), x2: x(t), y1: height - MARGIN.b, y2: height - MARGIN.b + 3, stroke: "var(--axis)",
          "shape-rendering": "crispEdges" }, grid);
      }
    }
    const now = Date.now() / 60000;
    if (now > x0 && now < x1) {
      el("line", { x1: x(now), x2: x(now), y1: top, y2: height - MARGIN.b, stroke: "var(--ink-2)",
        "stroke-dasharray": "2 3" }, grid);
      el("text", { x: x(now) + 3, y: top + 9, class: "now" }, grid).textContent = "now";
    }
    const edges = [x0, ...days, x1];
    const labelYs = [height - 5, frame.topAxis ? TOP_AXIS - 2 : null].filter((v) => v !== null);
    for (const labelY of labelYs) {
      for (let i = 0; days.length && i + 1 < edges.length; i++) {
        if (x(edges[i + 1]) - x(edges[i]) < 28) continue;
        el("text", { x: (x(edges[i]) + x(edges[i + 1])) / 2, y: labelY, "text-anchor": "middle" }, grid)
          .textContent = fmtDay((edges[i] + edges[i + 1]) / 2);
      }
      if (days.length === 0) {
        // Within one day: label whole hours, as many as fit.
        const every = [1, 2, 3, 6, 12].find((h) => x(x0 + h * 60) - x(x0) >= 44) || 24;
        for (const [t, hour] of hours) {
          if (hour % every) continue;
          const anchor = x(t) > width - MARGIN.r - 16 ? "end" : "middle";
          el("text", { x: Math.min(x(t), width - MARGIN.r), y: labelY, "text-anchor": anchor }, grid)
            .textContent = `${hour}:00`;
        }
      }
    }
  } else {
    const every = Math.ceil(axis.positions.length / Math.max(2, Math.floor((width - MARGIN.l) / 48)));
    axis.positions.forEach((p, i) => {
      if (i % every) return;
      el("text", { x: x(p + axis.width / 2), y: height - 5, "text-anchor": "middle" }, grid)
        .textContent = String(axis.labels[i]);
    });
  }
  el("line", { x1: MARGIN.l, x2: width - MARGIN.r, y1: y(lo), y2: y(lo), stroke: "var(--axis)",
    "shape-rendering": "crispEdges" }, grid);
  if (quantityOf(f) === "temperature" && lo < 0 && hi > 0) {
    // Freezing.
    el("line", { x1: MARGIN.l, x2: width - MARGIN.r, y1: y(0), y2: y(0), stroke: "var(--s1)", "stroke-opacity": 0.6,
      "stroke-dasharray": "4 3", "shape-rendering": "crispEdges" }, grid);
  }

  const marks = el("g", {}, svg);
  const single = series.length === 1;
  if (axis.bars) drawBars(marks, axis, series, x, y);
  else for (const s of series) {
    for (const [low, high] of s.bands) band(marks, axis, low, high, x, y, s.color, single ? 0.22 : 0.12);
    for (const row of s.members) line(marks, axis, row, x, y, s.color, 1, single ? 0.22 : 0.1);
    if (s.median) line(marks, axis, s.median, x, y, s.color, 2, 1, dashOf(s.model));
  }
  const cursor = el("line", { y1: top, y2: height - MARGIN.b, stroke: "var(--ink-2)", visibility: "hidden",
    "shape-rendering": "crispEdges" }, svg);
  const entry = { svg, cursor, x, field: f, place, series, axis, range };
  graphPanels.push(entry);
  attachGraphHover(entry);
}

// Where the sun of a graph is, as (minutes) → [lat, lon]: the panel's place, the rider's position on a route
// (nearest sample), or the query's single place; null where a graph has no one place.
function sunPlace(f, place, axis) {
  if (f.has("point")) {
    const c = f.coords.point;
    return () => [c.lat[place], c.lon[place]];
  }
  if (axis.route) {
    const r = axis.route;
    return (t) => {
      let i = 0;
      while (i + 1 < r.minutes.length && Math.abs(r.minutes[i + 1] - t) <= Math.abs(r.minutes[i] - t)) i++;
      return [r.lat[i], r.lon[i]];
    };
  }
  const loc = chart.location;
  return loc ? () => [loc.lat, loc.lon] : null;
}

// The sun's elevation in degrees at a time (minutes since the epoch) and place: the low-precision formulas of
// the Astronomical Almanac, within a few hundredths of a degree for decades around 2000.
function sunElevation(minutes, lat, lon) {
  const rad = Math.PI / 180;
  const d = minutes / 1440 - 10957.5; // days since 2000-01-01 12:00 UTC
  const g = (357.529 + 0.98560028 * d) * rad;
  const q = 280.459 + 0.98564736 * d;
  const l = (q + 1.915 * Math.sin(g) + 0.020 * Math.sin(2 * g)) * rad;
  const e = (23.439 - 0.00000036 * d) * rad;
  const ra = Math.atan2(Math.cos(e) * Math.sin(l), Math.cos(l));
  const dec = Math.asin(Math.sin(e) * Math.sin(l));
  const gmst = (18.697374558 + 24.06570982441908 * d) * 15 * rad;
  const ha = gmst + lon * rad - ra;
  return Math.asin(Math.sin(lat * rad) * Math.sin(dec) + Math.cos(lat * rad) * Math.cos(dec) * Math.cos(ha)) / rad;
}

// Night intervals [from, to] within a and b: sun below the horizon (its upper edge, with refraction), to 10 minutes.
function nights(a, b, where) {
  const out = [];
  let start = null;
  for (let t = a; t <= b + 10; t += 10) {
    const tt = Math.min(t, b);
    const [lat, lon] = where(tt);
    const dark = sunElevation(tt, lat, lon) < -0.833;
    if (dark && start === null) start = tt;
    if ((!dark || tt === b) && start !== null) {
      out.push([start, tt]);
      start = null;
    }
    if (tt === b) break;
  }
  return out;
}

// How far along x one position reaches: hourly values sit at their label; coarser steps (resampled) and bins
// hold over their bucket.
function spanOf(axis) {
  return axis.time && axis.width <= 60 && !axis.bars ? 0 : axis.width;
}

// Where along x the value of a position is read: the middle of its bucket.
function centreOf(axis, p) {
  return p + spanOf(axis) / 2;
}

// A bar series: solid to the median (or the value, or the lowest quantile when there's no median), faint to the
// 90th percentile of members (or the highest quantile); for members also the share of wet ones. Spaghetti would
// hide that most members are dry while a few are wet.
function barsOf(s) {
  if (s.members.length) {
    const wet = s.median.map((_, i) => {
      const column = s.members.map((row) => row[i]).filter((v) => v !== null);
      return column.length ? column.filter((v) => v >= WET).length / column.length : null;
    });
    return { solid: s.median, faint: s.bands[0][1], wet };
  }
  if (s.bands.length) return { solid: s.median || s.bands[0][0], faint: s.bands[0][1], wet: null };
  return { solid: s.median, faint: null, wet: null };
}

// Bars per bucket, the models side by side in their fixed order (which, with colour, tells them apart).
function drawBars(parent, axis, series, x, y) {
  const n = series.length;
  const zero = y(0);
  axis.positions.forEach((p, i) => {
    const left = x(p);
    const right = x(p + axis.width);
    const gap = Math.min(1.5, (right - left) * 0.15);
    const slot = (right - left - 2 * gap) / n;
    series.forEach((s, k) => {
      const bx = left + gap + k * slot;
      const bw = Math.max(1, slot - (n > 1 ? Math.min(1, slot * 0.2) : 0));
      for (const [row, opacity] of [[s.faint, 0.3], [s.solid, 0.9]]) {
        const v = row ? row[i] : null;
        if (v === null || v <= 0) continue;
        el("rect", { x: bx.toFixed(1), y: y(v).toFixed(1), width: bw.toFixed(1), height: Math.max(0.5, zero - y(v)).toFixed(1),
          fill: s.color, "fill-opacity": opacity }, parent);
      }
    });
  });
}

// Points along x: hourly values at their label; coarser steps (resampled) hold over their bucket.
function pts(axis, values, x, y) {
  const out = [];
  values.forEach((v, i) => {
    if (v === null) { out.push(null); return; }
    const p = axis.positions[i];
    if (axis.time && axis.width > 60) out.push([x(p), y(v)], [x(p + axis.width), y(v)]);
    else if (!axis.time) out.push([x(p + axis.width / 2), y(v)]);
    else out.push([x(p), y(v)]);
  });
  return out;
}

function pathOf(points) {
  let d = "";
  let pen = false;
  for (const p of points) {
    if (!p) { pen = false; continue; }
    d += `${pen ? "L" : "M"}${p[0].toFixed(1)},${p[1].toFixed(1)}`;
    pen = true;
  }
  return d;
}

function line(parent, axis, values, x, y, color, width, opacity, dash) {
  const points = pts(axis, values, x, y);
  const d = pathOf(points);
  if (!d) return;
  if (points.filter(Boolean).length === 1) {
    const [px, py] = points.find(Boolean);
    el("circle", { cx: px, cy: py, r: 4, fill: color, "fill-opacity": opacity }, parent);
    return;
  }
  el("path", { d, fill: "none", stroke: color, "stroke-width": width, "stroke-opacity": opacity,
    "stroke-linejoin": "round", "stroke-linecap": "round", ...(dash ? { "stroke-dasharray": dash[0] } : {}) }, parent);
}

function band(parent, axis, low, high, x, y, color, opacity) {
  const upper = pts(axis, high, x, y);
  const lower = pts(axis, low, x, y);
  let run = [];
  const flush = () => {
    if (run.length > 1) {
      const d = `${pathOf(run.map((i) => upper[i]))}L${pathOf(run.map((i) => lower[i]).reverse()).slice(1)}Z`;
      el("path", { d, fill: color, "fill-opacity": opacity, stroke: "none" }, parent);
    }
    run = [];
  };
  for (let i = 0; i < upper.length; i++) {
    if (upper[i] && lower[i]) run.push(i); else flush();
  }
  flush();
}

function attachGraphHover(entry) {
  const { svg, axis, range } = entry;
  const width = svg.viewBox.baseVal.width;
  const toX = (clientX) => {
    const box = svg.getBoundingClientRect();
    const px = ((clientX - box.left) / box.width) * width;
    const raw = range[0] + ((px - MARGIN.l) / (width - MARGIN.l - MARGIN.r)) * (range[1] - range[0]);
    return nearest(axis, raw);
  };
  const move = (e) => setGraphHover(toX(e.clientX), entry, e.clientY);
  svg.addEventListener("pointermove", move);
  svg.addEventListener("pointerdown", move);
  svg.addEventListener("pointerleave", (e) => { if (e.pointerType === "mouse") setGraphHover(null); });
  svg.addEventListener("blur", () => setGraphHover(null));
  svg.addEventListener("keydown", (e) => {
    if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
    e.preventDefault();
    let i = hoverX === null ? -1 : axis.positions.indexOf(hoverX);
    i = i < 0 ? 0 : Math.max(0, Math.min(axis.positions.length - 1, i + (e.key === "ArrowRight" ? 1 : -1)));
    const box = svg.getBoundingClientRect();
    setGraphHover(axis.positions[i], entry, box.top + box.height / 3);
  });
}

function nearest(axis, raw) {
  let best = null;
  for (const p of axis.positions) {
    const centre = centreOf(axis, p);
    if (best === null || Math.abs(centre - raw) < Math.abs(best.c - raw)) best = { p, c: centre };
  }
  return best ? best.p : null;
}

function setGraphHover(position, entry, clientY) {
  hoverX = position;
  for (const panel of graphPanels) {
    const show = position !== null && panel.axis.dim === (entry && entry.axis.dim);
    panel.cursor.setAttribute("visibility", show ? "visible" : "hidden");
    if (show) {
      // Where the hovered panel reads it: panels with another step (hourly next to daily) mark the same time.
      const cx = panel.x(centreOf(entry.axis, position));
      panel.cursor.setAttribute("x1", cx);
      panel.cursor.setAttribute("x2", cx);
    }
  }
  updateRouteCursor(position, entry);
  if (position === null) { hideTooltip(); return; }
  const tooltip = document.getElementById("tooltip");
  tooltip.replaceChildren();
  const i = entry.axis.positions.indexOf(position);
  html("div", { class: "when" }, tooltip, entry.axis.time ? fmtWhen(position) : String(entry.axis.labels[i]));
  for (const s of entry.series) {
    const median = s.median ? s.median[i] : null;
    const range = s.bands.length ? [s.bands[0][0][i], s.bands[0][1][i]] : null;
    const wet = s.wet && s.wet[i] !== null ? `${Math.round(s.wet[i] * 100)} % wet` : "";
    tooltipRow(tooltip, s.model, entry.field, median, range, s.model !== undefined ? modelName(s.model) : "", wet);
  }
  placeTooltip(entry.svg, entry.x(centreOf(entry.axis, position)), clientY);
}

function tooltipRow(parent, model, f, value, range, what, note) {
  const row = html("div", { class: "row" }, parent);
  modelKey(row, model);
  html("strong", {}, row, fmtValue(f, value));
  if (range && range[0] !== null && range[1] !== null) {
    html("span", { class: "range" }, row, `${fmtValue(f, range[0])}–${fmtValue(f, range[1])}`);
  }
  if (note) html("span", { class: "range" }, row, note);
  if (what) html("span", { class: "what" }, row, what);
}

function placeTooltip(svg, svgX, clientY) {
  const tooltip = document.getElementById("tooltip");
  tooltip.style.display = "block";
  const app = document.getElementById("app").getBoundingClientRect();
  const box = svg.getBoundingClientRect();
  const px = box.left - app.left + (svgX / svg.viewBox.baseVal.width) * box.width;
  const w = tooltip.offsetWidth;
  const left = px + 12 + w > app.width - 8 ? px - 12 - w : px + 12;
  tooltip.style.left = `${Math.max(8, left)}px`;
  tooltip.style.top = `${Math.max(4, clientY - app.top - tooltip.offsetHeight - 12)}px`;
}

function hideTooltip() {
  document.getElementById("tooltip").style.display = "none";
}

document.addEventListener("pointerdown", (e) => {
  if (!e.target.closest || !e.target.closest(".panel svg")) {
    setGraphHover(null);
    hideTooltip();
  }
});

// ---- maps -------------------------------------------------------------------------------------------------

// Equirectangular, x scaled by cos(latitude) at the centre.
function projection(bounds, width) {
  const [s, w, n, e] = bounds;
  const k = Math.cos(((s + n) / 2) * Math.PI / 180);
  const spanX = (e - w) * k;
  const spanY = n - s;
  const height = Math.min(Math.max(width * spanY / spanX, 0.4 * width), 1.4 * width);
  const scale = Math.min(width / spanX, height / spanY);
  const ox = (width - spanX * scale) / 2;
  const oy = (height - spanY * scale) / 2;
  return {
    width, height,
    x: (lon) => ox + (lon - w) * k * scale,
    y: (lat) => oy + (n - lat) * scale,
    lon: (x) => w + (x - ox) / (k * scale),
    lat: (y) => n - (y - oy) / scale,
  };
}

// The map's own viewport, inside the panel's: an SVG wider than the map shows what's beyond the map's edges,
// and this clips it.
function mapFrame(svg, p) {
  return el("svg", { width: p.width, height: p.height, viewBox: `0 0 ${p.width} ${p.height}` }, svg);
}

// The basemap in two layers: land and water under the values, lines and towns over them (letting the pointer
// through to the values).
function drawGround(svg, p) {
  const map = chart.basemap;
  if (!map) return;
  const g = el("g", { "pointer-events": "none" }, svg);
  const [south, west, north, east] = map.bounds;
  el("rect", { x: p.x(west), y: p.y(north), width: p.x(east) - p.x(west), height: p.y(south) - p.y(north),
    fill: "var(--water)" }, g);
  // Land comes in tiles: a stroke in the same colour hides the seams between them.
  el("path", { d: pathOfRings(map.land, p), fill: "var(--ground)", stroke: "var(--ground)", "stroke-width": 0.6,
    "fill-rule": "evenodd" }, g);
  el("path", { d: pathOfRings(map.lake, p), fill: "var(--water)", "fill-rule": "evenodd" }, g);
}

const MAP_LINES = [
  ["road", "var(--road)", 0.6, 0.35, ""],
  ["motorway", "var(--road)", 1.1, 0.5, ""],
  // Lake shores too, as the values cover the water.
  ["lake_shore", "var(--river)", 0.7, 0.8, ""],
  ["river", "var(--river)", 0.7, 0.8, ""],
  ["river_major", "var(--river)", 1.3, 0.85, ""],
  ["border", "var(--ink-2)", 0.8, 0.6, "4 2"],
  ["coastline", "var(--land)", 0.8, 0.7, ""],
];

function drawMapLines(svg, p) {
  const map = chart.basemap;
  if (!map) return;
  const g = el("g", { fill: "none", "stroke-linejoin": "round", "stroke-linecap": "round", "pointer-events": "none" },
    svg);
  for (const [name, color, width, opacity, dash] of MAP_LINES) {
    if (!map[name] || !map[name].length) continue;
    el("path", { d: map[name].map((c) => pathOfCoords(c, p)).join(""), stroke: color, "stroke-width": width,
      "stroke-opacity": opacity, ...(dash ? { "stroke-dasharray": dash } : {}) }, g);
  }
}

// Town names, largest first, where they don't overlap each other or `taken` (boxes [x0, y0, x1, y1]).
function drawTowns(svg, p, taken) {
  const map = chart.basemap;
  if (!map || !map.places) return;
  const g = el("g", { "pointer-events": "none" }, svg);
  const boxes = [...taken];
  const free = (b) => b[0] >= 2 && b[2] <= p.width - 2 && b[1] >= 2 && b[3] <= p.height - 2
    && !boxes.some((o) => b[0] < o[2] && b[2] > o[0] && b[1] < o[3] && b[3] > o[1]);
  // Few enough to stay a background: about one name per 130 × 90 units.
  let room = Math.max(4, Math.round((p.width * p.height) / 12000));
  for (const [i, [lat, lon, name]] of map.places.entries()) {
    if (!room) break;
    const x = p.x(lon), y = p.y(lat);
    // The few largest stand out.
    const big = i < 6;
    const w = name.length * (big ? 6.8 : 5.6);
    // Right of the dot, else left of it.
    const right = [x - 3, y - 7, x + 5 + w, y + 6];
    const left = [x - 5 - w, y - 7, x + 3, y + 6];
    const box = free(right) ? right : free(left) ? left : null;
    if (!box) continue;
    boxes.push(box);
    room--;
    el("circle", { cx: x, cy: y, r: 1.8, fill: "var(--ink-2)", stroke: "var(--surface)", "stroke-width": 0.8 }, g);
    const text = el("text", { x: box === right ? x + 4 : x - 4, y: y + 3.5, class: big ? "town big" : "town",
      "text-anchor": box === right ? "start" : "end" }, g);
    text.textContent = name;
  }
}

function pathOfCoords(coords, p) {
  let d = "";
  for (let i = 0; i < coords.length; i += 2) d += `${i ? "L" : "M"}${p.x(coords[i + 1]).toFixed(1)},${p.y(coords[i]).toFixed(1)}`;
  return d;
}

function pathOfRings(rings, p) {
  return (rings || []).map((r) => `${pathOfCoords(r, p)}Z`).join("");
}

// Sequential (one hue) for magnitudes, the hue by quantity; diverging around 0 for temperatures (0 °C: freezing)
// and other values on both sides. In light mode small values recede toward the light surface, in dark mode toward
// the dark one: the same steps, reversed.
const SEQ = {
  blue: ["#cde2fb", "#9ec5f4", "#6da7ec", "#3987e5", "#256abf", "#184f95", "#0d366b"],
  violet: ["#e6e3f8", "#c9c2f0", "#a89de6", "#8677d9", "#6656c4", "#4a3aa7", "#2f2475"],
  orange: ["#fde4cf", "#fbc49b", "#f5a066", "#eb6834", "#c8501f", "#9a3c15", "#6b290d"],
  grey: ["#ecebe6", "#d6d5ce", "#bdbcb3", "#a3a299", "#898781", "#6c6b66", "#52514e"],
};
const SEQ_HUE = { precip: "blue", probability: "blue", wind: "violet", energy: "orange", cloud: "grey" };
// Both arms end in the neutral midpoint, so 0 is grey and not light blue or light red; the poles stand out
// from the surface in either mode.
const DIVERGING = {
  light: { neg: ["#0d366b", "#256abf", "#6da7ec", "#cde2fb", "#f0efec"],
    pos: ["#f0efec", "#fbd5cd", "#ef8f7d", "#d4483b", "#8f1d1b"] },
  dark: { neg: ["#cde2fb", "#6da7ec", "#256abf", "#184f95", "#383835"],
    pos: ["#383835", "#8f1d1b", "#d4483b", "#ef8f7d", "#fbd5cd"] },
};
// Precipitation classes (mm/h or mm), as on weather maps: finer where most of it falls. Below the first, no fill.
const PRECIP_BOUNDS = [0.1, 0.2, 0.5, 1, 2, 5, 10, 20, 50, 100, 200, 500];

function isDark() {
  return getComputedStyle(document.documentElement).colorScheme.includes("dark");
}

// Classes with round bounds, one colour each: a value reads off the legend, and maps compare class by class.
// Colours "none" leave the basemap visible: dry, unlikely, clear sky. Values below the first bound take the first
// class, except for precipitation (dry: none).
function colorScale(f, lo, hi) {
  const dark = isDark();
  const q = quantityOf(f);
  const seq = (hue) => (dark ? [...SEQ[hue]].reverse() : SEQ[hue]);
  const spread = (stops, n) => Array.from({ length: n }, (_, i) => ramp(stops, n > 1 ? i / (n - 1) : 0.5));
  let bounds;
  let colors;
  let below = null;
  if (q === "condition") {
    bounds = [0, 0.5, 1];
    colors = [ramp(seq("blue"), 0.1), ramp(seq("blue"), 0.9)];
  } else if (q === "precip") {
    const last = PRECIP_BOUNDS.findIndex((b) => b >= hi);
    bounds = PRECIP_BOUNDS.slice(0, Math.max(3, last < 0 ? PRECIP_BOUNDS.length : last + 1));
    colors = spread(seq("blue"), bounds.length - 1);
    below = "none";
  } else if (q === "probability" || q === "cloud") {
    // Up to 10 % (20 % cloud): no fill.
    bounds = q === "cloud" ? classBounds(0, 100, 5) : classBounds(0, 1, 10);
    colors = ["none", ...spread(seq(SEQ_HUE[q]).slice(1), bounds.length - 2)];
  } else if (q === "temperature" || (lo < 0 && hi > 0)) {
    // 0 is a bound when the values cross it. Colour by distance from 0, the same on both sides, from a step off
    // neutral to the poles, over the classes there are: a summer map spans the red arm, not just its end.
    bounds = classBounds(lo, hi, q === "temperature" ? 8 : 6); // a degree or two per class reads as a gradient
    const mids = bounds.slice(1).map((b, i) => (bounds[i] + b) / 2);
    const [near, far] = extent(mids.map(Math.abs));
    const d = DIVERGING[dark ? "dark" : "light"];
    colors = mids.map((mid) => {
      const t = 0.2 + 0.8 * (Math.abs(mid) - near) / ((far - near) || 1);
      return mid < 0 ? ramp(d.neg, 1 - t) : ramp(d.pos, t);
    });
  } else {
    bounds = classBounds(lo, hi, 6);
    colors = spread(seq(SEQ_HUE[q] || "blue"), bounds.length - 1);
  }
  const color = (v) => {
    if (below !== null && v < bounds[0]) return below;
    let i = 0;
    while (i < colors.length - 1 && v >= bounds[i + 1]) i++;
    return colors[i];
  };
  return { bounds, colors, color };
}

// Round bounds from at most lo to at least hi, about `count` classes.
function classBounds(lo, hi, count) {
  const ticks = niceTicks(lo, hi, count);
  const step = ticks.length > 1 ? ticks[1] - ticks[0] : Math.pow(10, Math.floor(Math.log10(Math.abs(hi - lo) || 1)));
  let v = Math.floor(lo / step + 1e-9) * step;
  const out = [+v.toFixed(10)];
  do {
    v += step;
    out.push(+v.toFixed(10));
  } while (v < hi - step * 1e-9);
  return out;
}

function ramp(stops, t) {
  t = Math.max(0, Math.min(1, t));
  const pos = t * (stops.length - 1);
  const i = Math.min(Math.floor(pos), stops.length - 2);
  return mix(stops[i], stops[i + 1], pos - i);
}

function mix(a, b, t) {
  const pa = [1, 3, 5].map((k) => parseInt(a.slice(k, k + 2), 16));
  const pb = [1, 3, 5].map((k) => parseInt(b.slice(k, k + 2), 16));
  return `rgb(${pa.map((v, k) => Math.round(v + (pb[k] - v) * t)).join(",")})`;
}

// The classes as swatches, labelled at their bounds (yes/no: under each swatch).
function scaleLegend(parent, f, scale) {
  const n = scale.colors.length;
  const width = Math.max(160, Math.min(parent.clientWidth || 320, 320));
  const svg = el("svg", { viewBox: `0 0 ${width} 26`, width, height: 26, role: "img",
    "aria-label": `Colour scale: ${scale.bounds.map((b) => fmtTick(f, b)).join(", ")}` },
    html("div", { class: "scale" }, parent));
  const pad = 14;
  const w = (width - 2 * pad) / n;
  scale.colors.forEach((c, i) => {
    el("rect", { x: pad + i * w, y: 0, width: Math.max(1, w - 1), height: 8, fill: c,
      ...(c === "none" ? { stroke: "var(--axis)", x: pad + i * w + 0.5, y: 0.5, width: Math.max(1, w - 2), height: 7 } : {}) }, svg);
  });
  if (f.yesno) {
    ["no", "yes"].forEach((t, i) => {
      el("text", { x: pad + (i + 0.5) * w, y: 22, "text-anchor": "middle" }, svg).textContent = t;
    });
    return;
  }
  // Every bound when they fit, else every second, third…; the outer ones always.
  const longest = Math.max(...scale.bounds.map((b) => fmtTick(f, b).length));
  const every = Math.max(1, Math.ceil((longest * 6.5 + 6) / w));
  scale.bounds.forEach((b, i) => {
    const shown = i === 0 || i === n || (i % every === 0 && n - i >= every);
    if (!shown) return;
    el("text", { x: pad + i * w, y: 22, "text-anchor": "middle" }, svg).textContent = fmtTick(f, b);
  });
}

function renderMaps(body, f) {
  const models = shownModels(f);
  html("h2", {}, body, `${fieldLabel(f)}${f.unit && !f.percent ? ` (${f.unit})` : ""}`);
  const controls = html("div", {}, body);
  if (f.has("quantile")) {
    const nav = html("div", { class: "chips" }, controls);
    const levels = f.coords.quantile.values;
    if (f.view.quantile === null) f.view.quantile = Math.floor(levels.length / 2);
    levels.forEach((q, i) => chip(nav, quantileLabel(q), f.view.quantile === i, () => {
      f.view.quantile = i;
      render();
    }));
  }
  const times = f.has("time") ? f.coords.time.minutes : null;
  // One colour scale across models and times, so maps compare.
  let [lo, hi] = extent(f.data) || [0, 1];
  if (f.percent || f.yesno) { lo = 0; hi = 1; }
  const scale = colorScale(f, lo, hi);
  const grid = html("div", { class: "maps" }, body);
  // All cells first: the grid's columns, and so each map's width, depend on how many there are.
  const cells = models.map((model) => {
    const cell = html("div", { class: "panel" }, grid);
    if (model !== undefined) {
      const head = html("div", { class: "panel-head" }, cell);
      const label = html("span", {}, head);
      modelKey(label, model).style.marginRight = "6px";
      label.appendChild(document.createTextNode(modelName(model)));
    }
    return cell;
  });
  // Drawn at the size shown, so text and lines keep their size on narrow screens.
  const width = Math.round(cells.length ? cells[0].clientWidth : 0) || 600;
  const draws = [];
  models.forEach((model, k) => {
    const p = projection(chart.basemap ? chart.basemap.bounds : boundsOf(f), width);
    const svg = mapFrame(el("svg", { viewBox: `0 0 ${p.width} ${p.height}`, height: p.height, role: "img",
      "aria-label": `Map of ${fieldLabel(f)}${model ? ` for ${modelName(model)}` : ""}` }, cells[k]), p);
    drawGround(svg, p);
    const layer = el("g", {}, svg);
    drawMapLines(svg, p);
    drawTowns(svg, p, f.has("point") ? pointBoxes(f, p) : []);
    const labels = el("g", {}, svg);
    draws.push(() => drawMapLayer(layer, labels, f, model, p, scale));
  });
  scaleLegend(body, f, scale);
  const redraw = () => draws.forEach((d) => d());
  if (times && times.length > 1) timeSlider(body, f, times, redraw);
  redraw();
}

// Where the markers of places and their labels go, which town names keep clear of. The label shows the value at
// the time and quantile chosen: room for the longest.
function pointBoxes(f, p) {
  const c = f.coords.point;
  const [lo, hi] = extent(f.data) || [null, null];
  const value = Math.max(fmtValue(f, lo).length, fmtValue(f, hi).length);
  return c.lat.map((lat, i) => {
    const x = p.x(c.lon[i]), y = p.y(lat);
    const chars = (c.labels ? c.labels[i].length + 1 : 0) + value;
    return [x - 9, y - 9, x + 14 + chars * 6.5, y + 9];
  });
}

function boundsOf(f) {
  const lats = f.has("lat") ? f.coords.lat.values : f.coords.point.lat;
  const lons = f.has("lon") ? f.coords.lon.values : f.coords.point.lon;
  const [s, n] = extent(lats);
  const [w, e] = extent(lons);
  return [s - 0.5, w - 0.5, n + 0.5, e + 0.5];
}

function drawMapLayer(layer, labels, f, model, p, scale) {
  layer.replaceChildren();
  labels.replaceChildren();
  const index = { time: f.view.timeIndex, quantile: f.view.quantile || 0 };
  if (model !== undefined) index.model = modelIndex(f, model);
  if (f.has("lat")) {
    drawGrid(layer, f, model, p, scale, index);
    return;
  }
  const c = f.coords.point;
  c.lat.forEach((lat, i) => {
    const v = f.at({ ...index, point: i });
    const cx = p.x(c.lon[i]);
    const cy = p.y(lat);
    const fill = v === null ? "none" : scale.color(v);
    const dot = el("circle", { cx, cy, r: 7, fill: fill === "none" ? "var(--surface)" : fill,
      stroke: "var(--ink)", "stroke-width": 1 }, layer);
    cellHover(dot, f, v, placeName(f, i), model);
    el("text", { x: cx + 10, y: cy + 4, class: "place" }, labels).textContent =
      `${c.labels ? `${c.labels[i]} ` : ""}${fmtValue(f, v)}`;
  });
}

// A grid as runs of equal colour along each row, one path per colour: a handful of nodes however many cells, so
// the time slider stays smooth. The layer's opacity applies once to all of them, so neighbouring cells don't seam
// or darken where they overlap. One hit area finds the cell under the pointer from its position.
function drawGrid(layer, f, model, p, scale, index) {
  const lats = f.coords.lat.values;
  const lons = f.coords.lon.values;
  const dLat = lats.length > 1 ? lats[1] - lats[0] : 0.1;
  const dLon = lons.length > 1 ? lons[1] - lons[0] : 0.1;
  // Half a cell in drawing units, whichever way the axes run.
  const hw = Math.abs(p.x(lons[0] + dLon) - p.x(lons[0])) / 2;
  const hh = Math.abs(p.y(lats[0] + dLat) - p.y(lats[0])) / 2;
  const paths = new Map();
  const run = (color, j0, j1, lat) => {
    if (color === null || color === "none") return;
    const [a, b] = [p.x(lons[j0]), p.x(lons[j1])];
    const left = Math.min(a, b) - hw;
    const right = Math.max(a, b) + hw + 0.5; // a little over, against antialiasing seams
    const top = p.y(lat) - hh;
    paths.set(color, `${paths.get(color) || ""}M${left.toFixed(1)},${top.toFixed(1)}H${right.toFixed(1)}`
      + `V${(top + 2 * hh + 0.5).toFixed(1)}H${left.toFixed(1)}Z`);
  };
  lats.forEach((lat, i) => {
    let start = 0;
    let color = null;
    lons.forEach((_, j) => {
      const v = f.at({ ...index, lat: i, lon: j });
      const c = v === null ? null : scale.color(v);
      if (j > 0 && c !== color) {
        run(color, start, j - 1, lat);
        start = j;
      }
      color = c;
    });
    run(color, start, lons.length - 1, lat);
  });
  const cells = el("g", { opacity: 0.85 }, layer);
  for (const [color, d] of paths) el("path", { d, fill: color }, cells);
  const xs = extent(lons.map(p.x));
  const ys = extent(lats.map(p.y));
  // Unfilled cells (dry, unlikely) still show their value on hover.
  const hit = el("rect", { x: xs[0] - hw, y: ys[0] - hh, width: xs[1] - xs[0] + 2 * hw, height: ys[1] - ys[0] + 2 * hh,
    fill: "none", "pointer-events": "all" }, layer);
  const show = (e) => {
    const svg = outerSvg(hit);
    const box = svg.getBoundingClientRect();
    const lon = p.lon(((e.clientX - box.left) / box.width) * p.width);
    const lat = p.lat(((e.clientY - box.top) / box.height) * p.height);
    // The nearest row and column, as isel can leave axes uneven or out of order.
    const i = nearestIndex(lats, lat);
    const j = nearestIndex(lons, lon);
    const inside = Math.abs(lats[i] - lat) <= Math.abs(dLat) / 2 + 1e-9 && Math.abs(lons[j] - lon) <= Math.abs(dLon) / 2 + 1e-9;
    const v = inside ? f.at({ ...index, lat: i, lon: j }) : null;
    if (v === null) { hideTooltip(); return; }
    showCellTooltip(svg, e, f, v, `${lats[i].toFixed(2)}, ${lons[j].toFixed(2)}`, model);
  };
  hit.addEventListener("pointermove", show);
  hit.addEventListener("pointerdown", show);
  hit.addEventListener("pointerleave", (e) => { if (e.pointerType === "mouse") hideTooltip(); });
}

function nearestIndex(values, v) {
  let best = 0;
  for (let i = 1; i < values.length; i++) if (Math.abs(values[i] - v) < Math.abs(values[best] - v)) best = i;
  return best;
}

function showCellTooltip(svg, e, f, value, where, model) {
  const tooltip = document.getElementById("tooltip");
  tooltip.replaceChildren();
  html("div", { class: "when" }, tooltip, f.has("time") ? `${where} · ${fmtWhen(f.coords.time.minutes[f.view.timeIndex])}` : where);
  tooltipRow(tooltip, model, f, value, null, model !== undefined ? modelName(model) : "");
  const box = svg.getBoundingClientRect();
  placeTooltip(svg, ((e.clientX - box.left) / box.width) * svg.viewBox.baseVal.width, e.clientY);
}

// The panel's own SVG around a map's frame: the frame's box on screen counts the basemap beyond its edges, which
// it only clips; the panel's has the same drawing units and the box that is shown.
function outerSvg(node) {
  let svg = node.ownerSVGElement;
  while (svg.ownerSVGElement) svg = svg.ownerSVGElement;
  return svg;
}

function cellHover(node, f, value, where, model) {
  const show = (e) => showCellTooltip(outerSvg(node), e, f, value, where, model);
  node.addEventListener("pointermove", show);
  node.addEventListener("pointerdown", show);
  node.addEventListener("pointerleave", (e) => { if (e.pointerType === "mouse") hideTooltip(); });
}

function stopPlaying() {
  if (playing) clearInterval(playing.timer);
  playing = null;
}

function timeSlider(body, f, times, redraw) {
  const row = html("div", { class: "slider" }, body);
  const play = html("button", { type: "button", "aria-label": "Play" }, row, "▶");
  const input = html("input", { type: "range", min: 0, max: times.length - 1, step: 1, value: f.view.timeIndex,
    "aria-label": "Time" }, row);
  const out = html("output", {}, row, fmtWhen(times[f.view.timeIndex]));
  const set = (i) => {
    f.view.timeIndex = i;
    input.value = i;
    out.textContent = fmtWhen(times[i]);
    hideTooltip();
    redraw();
  };
  input.addEventListener("input", () => set(Number(input.value)));
  play.addEventListener("click", () => {
    const mine = playing && playing.field === f;
    stopPlaying();
    for (const b of document.querySelectorAll(".slider button")) b.textContent = "▶";
    if (mine) return;
    play.textContent = "❚❚";
    playing = { field: f, timer: setInterval(() => set((f.view.timeIndex + 1) % times.length), 600) };
  });
}

// Routes: the track on the basemap, with the hovered sample marked.
let routeMap = null;

function renderRouteMap(body, coord) {
  const bounds = chart.basemap ? chart.basemap.bounds
    : [extent(coord.lat)[0], extent(coord.lon)[0], extent(coord.lat)[1], extent(coord.lon)[1]];
  const panel = html("div", { class: "panel" }, body);
  panel.style.maxWidth = "420px";
  const p = projection(bounds, Math.round(panel.clientWidth) || 420);
  const svg = mapFrame(el("svg", { viewBox: `0 0 ${p.width} ${p.height}`, role: "img",
    "aria-label": "Map of the route" }, panel), p);
  drawGround(svg, p);
  drawMapLines(svg, p);
  drawTowns(svg, p, []);
  let d = "";
  coord.lat.forEach((lat, i) => { d += `${i ? "L" : "M"}${p.x(coord.lon[i]).toFixed(1)},${p.y(lat).toFixed(1)}`; });
  el("path", { d, fill: "none", stroke: "var(--ink)", "stroke-width": 2.5, "stroke-linejoin": "round" }, svg);
  const marker = el("circle", { r: 5, fill: "var(--s1)", stroke: "var(--surface)", "stroke-width": 2,
    visibility: "hidden" }, svg);
  routeMap = { coord, p, marker };
}

function updateRouteCursor(position, entry) {
  if (!routeMap) return;
  const i = position === null || !entry || !entry.axis.time ? -1 : routeMap.coord.minutes.indexOf(position);
  routeMap.marker.setAttribute("visibility", i < 0 ? "hidden" : "visible");
  if (i >= 0) {
    routeMap.marker.setAttribute("cx", routeMap.p.x(routeMap.coord.lon[i]));
    routeMap.marker.setAttribute("cy", routeMap.p.y(routeMap.coord.lat[i]));
  }
}

// ---- dots: values without an axis (per model, member, quantile) ------------------------------------------

function renderDots(body, f) {
  html("h2", {}, body, `${fieldLabel(f)}${f.unit && !f.percent ? ` (${f.unit})` : ""}`);
  if (!f.dims.length) {
    html("div", { class: "stat" }, body, fmtValue(f, f.data[0]));
    return;
  }
  const models = shownModels(f);
  const places = f.has("point") ? f.size("point") : 1;
  const rows = [];
  for (let p = 0; p < places; p++) {
    for (const model of models) {
      const index = { point: p };
      if (model !== undefined) index.model = modelIndex(f, model);
      let values;
      let marks;
      if (f.has("member")) {
        values = Array.from({ length: f.size("member") }, (_, m) => f.at({ ...index, member: m })).filter((v) => v !== null);
        const sorted = [...values].sort((a, b) => a - b);
        marks = { dots: values, range: [quantile(sorted, 0.1), quantile(sorted, 0.9)], mid: quantile(sorted, 0.5) };
      } else if (f.has("quantile")) {
        const levels = f.coords.quantile.values;
        values = levels.map((_, q) => f.at({ ...index, quantile: q }));
        const finite = values.filter((v) => v !== null);
        const median = levels.indexOf(0.5);
        marks = { dots: [], range: extent(finite), mid: median >= 0 ? values[median] : null };
      } else {
        values = [f.at(index)];
        marks = { dots: [], range: null, mid: values[0] };
      }
      const name = [f.has("point") ? placeName(f, p) : "", model !== undefined ? modelName(model) : ""]
        .filter(Boolean).join(" · ") || fieldLabel(f);
      rows.push({ name, model, values, marks });
    }
  }
  const all = rows.flatMap((r) => r.values).filter((v) => v !== null);
  let [lo, hi] = extent(all) || [0, 1];
  lo = Math.min(lo, 0);
  if (f.percent || f.yesno) hi = Math.max(hi, 1);
  const ticks = niceTicks(lo, hi, 4);
  lo = Math.min(lo, ticks[0]);
  hi = Math.max(hi, ticks[ticks.length - 1]);
  const width = Math.max(280, Math.min(document.getElementById("body").clientWidth, 720));
  const labelW = Math.min(150, width * 0.35);
  const rowH = 26;
  const height = rows.length * rowH + 22;
  const x = (v) => labelW + ((v - lo) / (hi - lo || 1)) * (width - labelW - 12);
  const panel = html("div", { class: "panel" }, body);
  const svg = el("svg", { viewBox: `0 0 ${width} ${height}`, height, role: "img",
    "aria-label": `${fieldLabel(f)} per model` }, panel);
  for (const t of ticks) {
    el("line", { x1: x(t), x2: x(t), y1: 0, y2: height - 18, stroke: "var(--grid)", "shape-rendering": "crispEdges" }, svg);
    el("text", { x: x(t), y: height - 4, "text-anchor": "middle" }, svg).textContent = fmtTick(f, t);
  }
  rows.forEach((r, i) => {
    const cy = i * rowH + rowH / 2;
    const color = colorOf(r.model);
    el("text", { x: 0, y: cy + 4, class: "place" }, svg).textContent = r.name.length > 24 ? `${r.name.slice(0, 23)}…` : r.name;
    if (r.marks.range) {
      el("line", { x1: x(r.marks.range[0]), x2: x(r.marks.range[1]), y1: cy, y2: cy, stroke: color,
        "stroke-width": 6, "stroke-opacity": 0.25, "stroke-linecap": "round" }, svg);
    }
    for (const v of r.marks.dots) el("circle", { cx: x(v), cy, r: 2.5, fill: color, "fill-opacity": 0.45 }, svg);
    if (r.marks.mid !== null) {
      el("circle", { cx: x(r.marks.mid), cy, r: 5, fill: color, stroke: "var(--surface)", "stroke-width": 2 }, svg);
      el("text", { x: Math.min(x(r.marks.mid) + 9, width - 60), y: cy - 7 }, svg).textContent = fmtValue(f, r.marks.mid);
    }
  });
}

// ---- table, notes, attribution ----------------------------------------------------------------------------

// One table per field, the first 2000 rows across all of them.
function renderTable() {
  const wrap = document.getElementById("table");
  wrap.replaceChildren();
  let room = 2000;
  for (const f of fields) {
    if (fields.length > 1) html("h2", {}, wrap, fieldLabel(f) || "value");
    const total = f.data.length;
    const shown = Math.min(total, room);
    room -= shown;
    if (shown) {
      const table = html("table", {}, wrap);
      const head = table.createTHead().insertRow();
      for (const text of [...f.dims, fieldLabel(f) + (f.unit && !f.percent ? ` (${f.unit})` : "")]) {
        html("th", {}, head, text);
      }
      const body = table.createTBody();
      for (let k = 0; k < shown; k++) {
        const row = body.insertRow();
        let rest = k;
        f.dims.forEach((d, i) => {
          const pos = Math.floor(rest / f.strides[i]);
          rest %= f.strides[i];
          row.insertCell().textContent = coordText(f, d, pos);
        });
        row.insertCell().textContent = fmtValue(f, f.data[k]);
      }
    }
    if (shown < total) html("p", {}, wrap, `First ${shown} of ${total} values.`);
  }
}

function coordText(f, dim, i) {
  const c = f.coords[dim];
  if (dim === "time") return fmtWhen(c.minutes[i]);
  if (dim === "model") return modelName(c.labels[i]);
  if (dim === "point") return placeName(f, i);
  if (dim === "quantile") return quantileLabel(c.values[i]);
  return String((c.values || c.labels)[i]);
}

function renderNotes() {
  const notes = document.getElementById("notes");
  notes.replaceChildren();
  for (const m of chart.models || []) {
    let text = `${m.name}: run ${m.run}, ${m.members} members, lead ${m.lead_hours[0]}–${m.lead_hours[1]} h`;
    if (m.missing_variables) text += `; no ${m.missing_variables.join(", ")}`;
    html("p", {}, notes, text);
  }
}

function renderAttribution() {
  const footer = document.getElementById("attribution");
  footer.replaceChildren();
  const seen = new Set();
  for (const a of chart.attribution || []) {
    const text = [a.model, a.run && `run ${a.run}`, a.license, a.notice].filter(Boolean).join(" · ");
    if (seen.has(text)) continue;
    seen.add(text);
    html("p", {}, footer, text);
  }
  if (chart.basemap) html("p", {}, footer, `Map: ${chart.basemap.source}`);
}

let lastWidth = 0;
new ResizeObserver(() => {
  const width = document.getElementById("app").clientWidth;
  if (chart && width !== lastWidth) {
    lastWidth = width;
    render();
  }
}).observe(document.getElementById("app"));
</script>
</body>
