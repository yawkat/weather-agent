#:schema ./__pyronaut__/schemas/pyronaut-pyproject.schema.json
# Generated by pyronaut-install for Pyronaut TOML schema support.

[project]
name = "weather_agent"
version = "0.1.0"
description = "Ensemble weather probabilities from open DWD/ECMWF data, served over MCP"
license = "Apache-2.0"
requires-python = ">=3.13"
dynamic = [
    "scripts",
]
dependencies = [
    "numpy>=2.4",
    # Pure-Python engine, kept out of src/ so the Pyronaut processor doesn't generate Java for its internals.
    "weather-core",
]

[dependency-groups]
# uv syncs the "dev" group by default; Pyronaut needs pytest in the venv for `pyronaut test`.
dev = [
    "pytest>=8",
]

[build-system]
requires = [
    "setuptools",
    "wheel",
    "tomli",
]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = [
    "src",
]

[tool.pyronaut]
repositories = [
    "mavenCentral",
    # netCDF-Java (GRIB decoding) is published to Unidata's repository, not Maven Central.
    "https://artifacts.unidata.ucar.edu/repository/unidata-all/",
]

[tool.pyronaut.core]
version = "5.2.14"

[tool.pyronaut.platform]
version = "5.2.1"

[tool.pyronaut.toolchain]
type = "jvm"

[tool.pyronaut.sources]
python = "src"
python-test = "tests"
resources = "config"
test-resources = "tests-config"

[tool.pyronaut.processor]
incremental = true
daemon = true
python-incremental-mode = "optimistic"

[tool.pyronaut.ide-stubs]
packages = [
    "io.micronaut",
    "jakarta",
]

[tool.pyronaut.validation]
enabled = true
suppressions = [
    "micronaut.test-resources*",
]

[tool.pyronaut.test]
engine = "pytest"

# Starts a Postgres container (rootless Docker) for `pyronaut dev` / `pyronaut test`.
[tool.pyronaut.test-resources]
enabled = true
infer-classpath = true

[tool.pyronaut.dependencies]
runtime = [
    "io.micronaut.data:micronaut-data-jdbc",
    "io.micronaut.flyway:micronaut-flyway",
    "io.micronaut.mcp:micronaut-mcp-server-java-sdk",
    "io.micronaut.pyronaut:micronaut-pyronaut-logback",
    "io.micronaut.serde:micronaut-serde-jackson",
    "io.micronaut.sql:micronaut-jdbc-hikari",
    "io.micronaut.testresources:micronaut-test-resources-client",
    "io.micronaut:micronaut-http-client",
    "io.micronaut:micronaut-http-server-netty",
    "org.flywaydb:flyway-database-postgresql",
    "org.postgresql:postgresql",
    "edu.ucar:grib:5.11.0",
    "org.duckdb:duckdb_jdbc:1.5.6.0",
]
build = [
    "io.micronaut.data:micronaut-data-processor",
    "io.micronaut.serde:micronaut-serde-processor",
    "io.micronaut:micronaut-http-validation",
]
test = [
    "io.micronaut.pyronaut:micronaut-pyronaut-pytest",
    "io.micronaut.pyronaut:micronaut-pyronaut-requests",
]

[tool.uv]
# Pyronaut runs the sources; uv only manages the GraalPy virtualenv.
package = false

# GraalPy-specific binary wheels (numpy etc.).
[[tool.uv.index]]
name = "graalpy"
url = "https://www.graalvm.org/python/wheels/"
explicit = true

[tool.uv.workspace]
members = ["packages/weather_core"]

[tool.uv.sources]
numpy = { index = "graalpy" }
weather-core = { workspace = true }
